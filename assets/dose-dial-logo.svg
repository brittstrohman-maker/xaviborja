<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C58E"/>
      <stop offset="60%" stop-color="#E5A968"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <radialGradient id="dialBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B1E26"/>
      <stop offset="85%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </radialGradient>
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dial Emblem Graphic -->
  <g transform="translate(4, 4)">
    <!-- Outer Hairline Halo -->
    <circle cx="20" cy="20" r="19.5" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Outer Dial Body -->
    <circle cx="20" cy="20" r="18" fill="url(#dialBg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2"/>
    
    <!-- Calibration Ticks (12 hours / micrometer notches) -->
    <!-- 12 o'clock (0 deg) Amber Master Notch -->
    <line x1="20" y1="3.5" x2="20" y2="7" stroke="url(#amberGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 3 o'clock (90 deg) -->
    <line x1="36.5" y1="20" x2="33" y2="20" stroke="url(#amberGrad)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 6 o'clock (180 deg) -->
    <line x1="20" y1="36.5" x2="20" y2="33" stroke="url(#amberGrad)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 9 o'clock (270 deg) -->
    <line x1="3.5" y1="20" x2="7" y2="20" stroke="url(#amberGrad)" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Intermediate Ticks (30, 60, 120, 150, 210, 240, 300, 330) -->
    <line x1="28.5" y1="5.3" x2="26.8" y2="8.3" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="34.7" y1="11.5" x2="31.7" y2="13.2" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="34.7" y1="28.5" x2="31.7" y2="26.8" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="28.5" y1="34.7" x2="26.8" y2="31.7" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="11.5" y1="34.7" x2="13.2" y2="31.7" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="5.3" y1="28.5" x2="8.3" y2="26.8" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="5.3" y1="11.5" x2="8.3" y2="13.2" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="11.5" y1="5.3" x2="13.2" y2="8.3" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Concentric Dosing Track -->
    <circle cx="20" cy="20" r="12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.8" stroke-dasharray="1.5 2"/>

    <!-- Stylized Geometric D Icon with Precision Dial Needle -->
    <!-- Vertical Spine -->
    <path d="M 13.5 11.5 C 13.5 10.7 14.2 10 15 10 L 15.5 10 C 16.3 10 17 10.7 17 11.5 L 17 28.5 C 17 29.3 16.3 30 15.5 30 L 15 30 C 14.2 30 13.5 29.3 13.5 28.5 Z" fill="#F3F4F6"/>
    <!-- Outer D Curve -->
    <path d="M 16 10 L 21 10 C 26.5 10 30.5 14.2 30.5 20 C 30.5 25.8 26.5 30 21 30 L 16 30" stroke="#F3F4F6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Precision Dial Indicator (Molten Amber Needle Point) -->
    <circle cx="21" cy="20" r="2.8" fill="url(#amberGrad)" filter="url(#amberGlow)"/>
    <circle cx="21" cy="20" r="1.2" fill="#FFFFFF"/>
    <!-- Active Dial Needle Pointer -->
    <line x1="21" y1="20" x2="26" y2="15" stroke="url(#amberGrad)" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(52, 0)">
    <!-- Wordmark: DOSE & DIAL -->
    <text x="0" y="26" fill="#F3F4F6" font-family="'Space Grotesk', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="800" letter-spacing="0.08em">DOSE</text>
    <text x="60" y="26" fill="url(#amberGrad)" font-family="'Space Grotesk', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.04em">&amp;</text>
    <text x="79" y="26" fill="#F3F4F6" font-family="'Space Grotesk', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="800" letter-spacing="0.08em">DIAL</text>

    <!-- Subtitle: PRECISION COFFEE LAB -->
    <text x="0.5" y="38" fill="#8A909E" font-family="'Space Grotesk', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.8" font-weight="600" letter-spacing="0.26em">PRECISION COFFEE LAB</text>
    <!-- Calibration Dot -->
    <circle cx="127" cy="35.5" r="1.3" fill="url(#amberGrad)"/>
  </g>
</svg>
