<!DOCTYPE html>
<html>
<head>
  <title>Viewport Stress Suite</title>
</head>
<body>
  <iframe id="f375" src="m2_child_header_test.html" style="width: 375px; height: 800px; border: 0;"></iframe>
  <iframe id="f390" src="m2_child_header_test.html" style="width: 390px; height: 800px; border: 0;"></iframe>
  <iframe id="f414" src="m2_child_header_test.html" style="width: 414px; height: 800px; border: 0;"></iframe>
  <iframe id="f320" src="m2_child_header_test.html" style="width: 320px; height: 800px; border: 0;"></iframe>
  <pre id="results">PENDING</pre>
  <script>
    const frames = ['f375', 'f390', 'f414', 'f320'];
    const collected = {};
    let loadedCount = 0;

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'metricsResult') {
        const w = e.data.data.viewportWidth;
        collected['vp_' + w] = e.data.data;
        if (Object.keys(collected).length === frames.length) {
          document.getElementById('results').innerText = JSON.stringify(collected, null, 2);
        }
      }
    });

    frames.forEach(id => {
      const f = document.getElementById(id);
      f.onload = () => {
        loadedCount++;
        if (loadedCount === frames.length) {
          setTimeout(() => {
            frames.forEach(fid => {
              document.getElementById(fid).contentWindow.postMessage('runMetrics', '*');
            });
          }, 600);
        }
      };
    });
  </script>
</body>
</html>
